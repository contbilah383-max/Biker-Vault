name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project and arrange files
        run: |
          mkdir -p /tmp/app
          cd /tmp/app
          flutter create --org com.biker --project-name moto_app .
          rm -rf lib test
          mkdir -p lib/screens
          cd "$GITHUB_WORKSPACE"
          find_file() { find "$GITHUB_WORKSPACE" -name "$1" -not -path "*/.git/*" | head -n 1; }
          cp "$(find_file main.dart)" /tmp/app/lib/main.dart
          for f in login_screen home_screen bikes_tab reminders_tab; do
            cp "$(find_file $f.dart)" /tmp/app/lib/screens/$f.dart
          done
          cp "$(find_file pubspec.yaml)" /tmp/app/pubspec.yaml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' /tmp/app/android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd /tmp/app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: biker-vault-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
